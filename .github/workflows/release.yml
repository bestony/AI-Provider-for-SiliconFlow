name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release metadata
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 '^ *\* Version:' bestony-ai-provider-for-siliconflow.php | awk '{print $3}')
          stable=$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')
          config=$(perl -ne "print \$1 if /const VERSION = '([\d.]+)'/" src/Util/SiliconflowConfig.php)
          test "$tag" = "$header" && test "$tag" = "$stable" && test "$tag" = "$config"
          grep -qx "= ${tag} =" readme.txt
      - name: Self-check
        run: php scripts/selfcheck.php
      - name: Build plugin zip
        run: |
          set -euo pipefail
          slug=bestony-ai-provider-for-siliconflow
          mkdir -p build
          git archive --format=zip --prefix="$slug/" -o "build/$slug-${GITHUB_REF_NAME}.zip" HEAD
          unzip -l "build/$slug-${GITHUB_REF_NAME}.zip" | grep -q "$slug/bestony-ai-provider-for-siliconflow.php"
          unzip -l "build/$slug-${GITHUB_REF_NAME}.zip" | grep -q "$slug/assets/images/siliconflow.svg"
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "= " v " =" {found=1; next} found && /^= / {exit} found' readme.txt > RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
